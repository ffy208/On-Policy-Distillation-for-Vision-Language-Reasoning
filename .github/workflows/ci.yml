name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (CPU torch)
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system "transformers>=4.57" "peft>=0.13"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
